[project]
name = "deepl-lab1"
version = "0.1.0"
description = "Manual backpropagation and gradient verification laboratory"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "torch==2.14.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
